name: Repro ad-hoc launch
on:
  push:
    branches: [dev/ciel-adhoc-runtime]
permissions:
  contents: read
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Environment
        run: |
          sw_vers
          csrutil status || true
      - name: Select Swift 6 toolchain
        run: |
          if [[ -d /Applications/Xcode_16.4.app ]]; then sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer; fi
      - name: Build ad-hoc with the fix
        env:
          CIEL_ARCH: arm64
        run: bash scripts/build.sh
      - name: Launch fixed build
        run: |
          codesign -dv dist/Ciel.app 2>&1 | grep -E 'flags=|Team'
          codesign -dv dist/Ciel.app/Contents/Frameworks/CTranscribe.framework 2>&1 | grep -E 'flags=|Team'
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          dist/Ciel.app/Contents/MacOS/Ciel > fixed.log 2>&1 &
          pid=$!
          sleep 6
          if kill -0 "$pid" 2>/dev/null; then echo "FIXED ALIVE"; kill "$pid"; else wait "$pid" || echo "FIXED EXITED $?"; fi
          cat fixed.log
          log show --start "$start" --style compact --predicate 'eventMessage CONTAINS "CTranscribe"' 2>/dev/null | grep -v 'log run' || true
      - name: Old ad-hoc runtime signing fails the build
        env:
          CIEL_ARCH: arm64
        run: |
          cp scripts/build.sh old-build.sh
          sed -i '' 's/sign=(codesign --force --sign -)/sign=(codesign --force --sign - --options runtime)/' scripts/build.sh
          git diff --stat
          if bash scripts/build.sh; then echo "OLD BUILD PASSED"; else echo "OLD BUILD REJECTED $?"; fi
          cp old-build.sh scripts/build.sh
      - name: Launch old signing
        run: |
          fw=dist/Ciel.app/Contents/Frameworks/CTranscribe.framework
          codesign --force --sign - --options runtime "$fw"
          codesign --force --sign - --options runtime --entitlements Resources/Ciel.entitlements dist/Ciel.app
          start="$(date '+%Y-%m-%d %H:%M:%S')"
          dist/Ciel.app/Contents/MacOS/Ciel > old.log 2>&1 &
          pid=$!
          sleep 6
          if kill -0 "$pid" 2>/dev/null; then echo "OLD ALIVE"; kill "$pid"; else wait "$pid" || echo "OLD EXITED $?"; fi
          cat old.log
          log show --start "$start" --style compact --predicate 'eventMessage CONTAINS "CTranscribe"' 2>/dev/null | grep -v 'log run' || true
