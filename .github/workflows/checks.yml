name: Check Ciel
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check format, scripts, metadata, unit tests, search budgets, and native app
        run: bash scripts/check.sh
      - name: Archive performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ciel-search-performance
          path: .build/performance/search-engine.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive native check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ciel-native-checks
          path: |
            .build/performance/native-ui.json
            .build/smoke
          if-no-files-found: warn
          retention-days: 14
      - name: Build Apple Silicon app
        env:
          CIEL_ARCH: arm64
        run: bash scripts/build.sh
      - name: Verify architecture and signature
        run: |
          test "$(lipo -archs dist/Ciel.app/Contents/MacOS/Ciel)" = arm64
          test "$(lipo -archs dist/Ciel.app/Contents/Frameworks/CTranscribe.framework/CTranscribe)" = arm64
          codesign --verify --strict --deep dist/Ciel.app
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Ciel.app dist/Ciel-development.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ciel-development
          path: dist/Ciel-development.zip
          if-no-files-found: error
          retention-days: 14
  mutants:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check that the tests catch each recorded past mistake
        run: bash scripts/mutants.sh
      - name: Archive mutant logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ciel-mutants
          path: .build/mutants
          if-no-files-found: warn
          retention-days: 14
