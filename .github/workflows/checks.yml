name: Check Ciel
# WARNING: release.yml finds the passed push run of this workflow on main by this file path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CIEL_SPEECH_MODEL: ${{ github.workspace }}/.build/speech/parakeet-ultra-Q5_K_M.gguf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Send the read-only job token on the git calls to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/git-auth.sh
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/speech/parakeet-ultra-Q5_K_M.gguf
          key: parakeet-ultra-Q5_K_M-f6e3d8172547a3bb468e92ff395696e6d2e0371a9e52690a27741b4e8561c997
      - name: Download the speech model
        run: |
          model="$CIEL_SPEECH_MODEL"
          if [ ! -f "$model" ]; then
            mkdir -p "$(dirname "$model")"
            curl -fsSL --retry 3 -o "$model" https://huggingface.co/handy-computer/parakeet-ultra-gguf/resolve/a1539be1b849ea7463b88343e5277b373d0c4ea9/parakeet-ultra-Q5_K_M.gguf
          fi
          echo "f6e3d8172547a3bb468e92ff395696e6d2e0371a9e52690a27741b4e8561c997  $model" | shasum -a 256 -c
      - name: gitleaks on the new commits
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          range=("$BASE..$HEAD")
          if [[ $BASE =~ ^0+$ ]]; then range=("$HEAD" -1); fi
          # WARNING: gitleaks exits 0 on a range git cannot read, so check the range first.
          git rev-list "${range[@]}" >/dev/null
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="${range[*]} -m" .
      - name: Fail when Package.resolved does not match Package.swift
        if: ${{ !cancelled() }}
        run: swift package resolve --force-resolved-versions
      - name: Fail on a high or critical advisory in a dependency
        if: ${{ !cancelled() }}
        env:
          OSV_SCANNER_VERSION: 2.7.1
          OSV_SCANNER_SHA256: b22c02877a811c8f78956e8643efa554932b7378f590d13f8e97d4e9448a29f3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_darwin_arm64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          OSV_SCANNER="$RUNNER_TEMP/osv-scanner" bash scripts/lint/audit.sh
      - name: No trailers in the PR commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/lint/check-commits.sh "$BASE..$HEAD"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ !cancelled() }}
        with:
          bun-version-file: package.json
      - name: Check format, scripts, metadata, unit tests, search budgets, and native app
        if: ${{ !cancelled() }}
        env:
          CIEL_COMMENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check.sh
      - name: Archive performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-search-performance
          path: .build/performance/search-engine.json
          if-no-files-found: warn
          retention-days: 14
      - name: Archive native check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-native-checks
          path: |
            .build/performance/native-ui.json
            .build/smoke
          if-no-files-found: warn
          retention-days: 14
      - name: Build Apple Silicon app
        if: ${{ !cancelled() }}
        env:
          CIEL_ARCH: arm64
        run: bash scripts/build.sh
      - name: Verify architecture and signature
        run: |
          test "$(lipo -archs dist/Ciel.app/Contents/MacOS/Ciel)" = arm64
          test "$(lipo -archs dist/Ciel.app/Contents/Frameworks/CTranscribe.framework/CTranscribe)" = arm64
          lipo dist/Ciel.app/Contents/Frameworks/Sparkle.framework/Sparkle -verify_arch arm64
          codesign --verify --strict --deep dist/Ciel.app
      - name: Build and check the disk image
        timeout-minutes: 5
        run: bash scripts/release/dmg.sh dist/Ciel.app dist/Ciel-development.dmg
      - name: Write the layout with dmgbuild and build an image from it
        timeout-minutes: 5
        run: |
          trap 'git checkout -- Resources/DiskImage.DS_Store' EXIT
          bash scripts/release/dmg.sh --layout
          bash scripts/release/dmg.sh dist/Ciel.app "$RUNNER_TEMP/Ciel-layout.dmg"
      - name: Capture the disk image window
        timeout-minutes: 2
        run: |
          attached=$(hdiutil attach dist/Ciel-development.dmg -readonly -noautoopen)
          device=$(awk '$1 ~ /^\/dev\// { print $1; exit }' <<<"$attached")
          trap 'hdiutil detach "$device" -quiet || hdiutil detach "$device" -force -quiet' EXIT
          mount=$(awk -F '\t' '$NF ~ /^\// { print $NF }' <<<"$attached")
          open "$mount"
          sleep 5
          screencapture -x dist/dmg-window.png
      - name: Archive the disk image window
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-disk-image-window
          path: dist/dmg-window.png
          if-no-files-found: warn
          retention-days: 14
      - name: Launch the built app
        timeout-minutes: 1
        run: |
          dist/Ciel.app/Contents/MacOS/Ciel &
          sleep 5
          kill -0 $!
          kill $!
          wait $! || true
      - name: Drive the built app with verify-ciel
        timeout-minutes: 5
        run: bash .agents/skills/verify-ciel/scripts/ciel-verify.sh journey all
      - name: Archive the verify-ciel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-verify-evidence
          path: .build/verify/evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Ciel.app dist/Ciel-development.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-development
          path: dist/Ciel-development.zip
          if-no-files-found: error
          retention-days: 14
  mutants-1:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send the read-only job token on the git calls to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/git-auth.sh
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check that the tests catch each recorded past mistake
        if: ${{ !cancelled() }}
        env:
          SHARD: 1/2
        run: bash scripts/mutants.sh --shard "$SHARD"
      - name: Archive mutant logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-mutants-1
          path: .build/mutants
          if-no-files-found: warn
          retention-days: 14
  mutants-2:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send the read-only job token on the git calls to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/git-auth.sh
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check that the tests catch each recorded past mistake
        if: ${{ !cancelled() }}
        env:
          SHARD: 2/2
        run: bash scripts/mutants.sh --shard "$SHARD"
      - name: Archive mutant logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-mutants-2
          path: .build/mutants
          if-no-files-found: warn
          retention-days: 14
  coverage:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send the read-only job token on the git calls to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/git-auth.sh
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Measure unit test coverage
        run: bash scripts/coverage.sh
      - name: Archive the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-coverage
          path: .build/coverage
          if-no-files-found: warn
          retention-days: 14
  dead-code:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PERIPHERY_VERSION: 3.8.0
      PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Send the read-only job token on the git calls to github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/git-auth.sh
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install periphery
        run: |
          curl -fsSL -o "$RUNNER_TEMP/periphery.zip" "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip"
          echo "$PERIPHERY_SHA256  $RUNNER_TEMP/periphery.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/periphery.zip" -d "$RUNNER_TEMP/periphery"
          echo "PERIPHERY=$RUNNER_TEMP/periphery/periphery" >>"$GITHUB_ENV"
      - name: Fail on unused declarations
        run: bash scripts/lint/dead-code.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile && cd site && bun install --frozen-lockfile
      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Select the tests of the changed site features
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # WARNING: an echo of the substitution would hide a failure of select.mjs, so assign it first.
        run: |
          grep=$(bun .agents/skills/verify-ciel/scripts/select.mjs "$BASE")
          echo "grep=$grep" >> "$GITHUB_OUTPUT"
      - name: Run @smoke and the selected @verify site tests
        env:
          GREP: ${{ steps.select.outputs.grep }}
        run: node_modules/.bin/playwright test --grep "$GREP" --project=desktop
      - name: Archive the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  # WARNING: the GitHub ruleset on main requires only gate, so gate must need every other job of this workflow.
  gate:
    if: always()
    needs: [check, mutants-1, mutants-2, coverage, dead-code, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: fail unless each job that gate needs passed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -f
          echo "job results: $RESULTS"
          if [ -z "${RESULTS//[[:space:]]/}" ]; then
            echo "gate needs no job, so it judged nothing"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a job that gate needs ended with $result, not success"
              exit 1
            fi
          done
