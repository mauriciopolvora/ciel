name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile && cd site && bun install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: node_modules/.bin/playwright install --with-deps chromium webkit
      - name: The full site suite on desktop and mobile
        run: node_modules/.bin/playwright test
      - name: Archive the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ciel-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signed-out GET of each public route and Download link
        run: bash site/prod-smoke.sh

  report:
    needs: [e2e, prod-smoke]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue, or comment on the open one
        run: |
          title="nightly is red"
          issue=$(gh issue list --state open --limit 1000 --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Red again: $RUN"
          else
            gh issue create --title "$title" --body "The nightly run failed: $RUN. Reproduce it with node_modules/.bin/playwright test, fix it, then close this issue."
          fi
