version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      swift-updates:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-updates:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      pip-updates:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-updates:
        patterns:
          - "*"
